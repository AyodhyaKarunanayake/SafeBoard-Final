name: safeboard
description: "SafeBoard - Gender-Aware Bus Seating Allocation System for Sri Lanka"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.7
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  cloud_functions: ^5.3.3
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
